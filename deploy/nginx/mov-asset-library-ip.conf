server {
    listen 80;
    listen [::]:80;
    server_name 119.91.33.40;

    root /var/www/apec;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /mov-asset-library {
        return 301 https://$host$request_uri;
    }

    location ^~ /mov-asset-library/ {
        return 301 https://$host$request_uri;
    }

    location ^~ /api/ {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 119.91.33.40;

    root /var/www/apec;
    index index.html;
    server_tokens off;
    client_max_body_size 513m;

    ssl_certificate /etc/letsencrypt/live/mov-asset-library/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mov-asset-library/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /mov-asset-library {
        return 301 /mov-asset-library/;
    }

    location ^~ /mov-asset-library/assets/ {
        root /var/www;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /mov-asset-library/ {
        root /var/www;
        try_files $uri $uri/ /mov-asset-library/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
