server {
    listen 80;
    listen [::]:80;
    server_name 119.91.33.40;

    root /var/www/mov-asset-library;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 513m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /mov-asset-library {
        return 301 /;
    }

    location ^~ /mov-asset-library/assets/ {
        rewrite ^/mov-asset-library(/assets/.*)$ $1 permanent;
    }

    location ^~ /mov-asset-library/ {
        return 301 /;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
