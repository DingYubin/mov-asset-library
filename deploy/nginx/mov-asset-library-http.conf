server {
    listen 80;
    listen [::]:80;
    server_name 119.91.33.40;

    root /var/www/apec;
    index index.html;
    client_max_body_size 513m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /mov-asset-library {
        return 301 https://$host$request_uri;
    }

    location ^~ /mov-asset-library/ {
        return 301 https://$host$request_uri;
    }

    location /api/ {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
